[project]
name = "linkingtk"
version = "0.1.0"
description = "A toolkit unifying Entity Alignment, Entity Linking, Word Sense Disambiguation and Word Sense Alignment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "transformers>=4.40",
    "datasets>=2.19",
    "peft>=0.11",
    "scikit-learn>=1.7.2",
    "scipy>=1.15",
]

[project.optional-dependencies]
graph = ["networkx>=3.0", "rdflib>=7.0"]
nlp = ["spacy>=3.7"]
kge = [
    "pykeen>=1.10",
    "rapidfuzz>=3.14.5",
]
wn = ["wn>=0.9"]
all = ["linkingtk[graph,nlp,kge,wn]"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkingtk"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
# Not a floor for our own code (requires-python/ruff's target-version stay
# 3.10) -- numpy 2.5.1's shipped stubs use PEP 695 syntax mypy can't parse
# below 3.12, and numpy is now imported directly (algorithms/ea/kge.py).
python_version = "3.12"
strict = true
packages = ["linkingtk"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["networkx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "pykeen.*", "torch.*", "datasets.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
