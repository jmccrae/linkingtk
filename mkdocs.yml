site_name: LinkingTK
site_description: A toolkit unifying Entity Alignment, Entity Linking, Word Sense Disambiguation and Word Sense Alignment.
site_url: https://john.mccr.ae/linkingtk/
repo_url: https://github.com/jmccrae/linkingtk
repo_name: jmccrae/linkingtk

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - Examples:
      - Overview: examples/index.md
      - Entity Alignment:
          - String similarity: examples/string_similarity_ea.md
          - Feature-based classifier: examples/feature_classifier_ea.md
          - Hard-negative sampling: examples/negative_sampling.md
          - Knowledge graph embeddings: examples/kge_ea.md
          - KGE method benchmarks: examples/ea_kge_benchmarks.md
          - Simple-HHEA on ICEWS-WIKI: examples/simple_hhea_ea.md
          - ChatEA LLM re-ranking on ICEWS-WIKI: examples/chatea_ea.md
      - Entity Linking:
          - ReFinED-style bi-encoder benchmark: examples/el_benchmarks.md
          - EL against live Wikipedia: examples/wikipedia_el.md
          - EL against live Wikidata: examples/wikidata_el.md
          - Fully-offline EL via a local vector index: examples/vector_index_el.md
          - Building a vector index from a real Wikidata dump: examples/build_wikidata_vector_index.md
          - LLM re-ranking over BLINK candidates: examples/blink_llm_reranker_benchmark.md
      - Word Sense Disambiguation:
          - Lesk WSD: examples/lesk_wsd.md
          - WSD against live WordNet (wn): examples/wn_wsd.md
          - GlossBERT reproduction: examples/glossbert_reproduction.md
          - GlossBERT training verification: examples/glossbert_benchmark.md
          - GlossBERT full-corpus training: examples/glossbert_full_training.md
          - LLM re-ranking over GlossBERT candidates: examples/glossbert_llm_reranker_benchmark.md
          - EWISER reproduction: examples/ewiser_reproduction.md
          - EWISER training verification: examples/ewiser_benchmark.md
          - EWISER pretrained output embedding: examples/ewiser_pretrained_output_embedding.md
          - EWISER full-corpus training: examples/ewiser_full_training.md
          - ESC reproduction: examples/esc_reproduction.md
          - ESC training verification: examples/esc_benchmark.md
          - Republishing UFSAC to the Hugging Face Hub: examples/publish_ufsac.md
      - ExactMatch blocking & evaluation: examples/exact_match_blocking.md
      - Advanced Topics:
          - LLM linker benchmarks (EA/EL/WSD): examples/llm_benchmark.md
          - Comparative benchmark harness (all tiers): examples/comparative_benchmark.md
  - Datasets:
      - Overview: datasets/index.md
      - Toy datasets: datasets/toy.md
      - Entity alignment datasets: datasets/real_world_ea.md
      - Entity linking datasets: datasets/entity_linking.md
      - Word sense disambiguation datasets: datasets/wsd.md
      - Entity Sources: datasets/sources.md
  - API Reference:
      - Core: reference/core.md
      - Sources: reference/sources.md
      - Blocking: reference/blocking.md
      - Algorithms: reference/algorithms.md
      - Datasets: reference/datasets.md
      - Utils: reference/utils.md
      - Training: reference/train.md
      - Evaluation: reference/eval.md
      - LLM: reference/llm.md
      - Exceptions: reference/exceptions.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            show_if_no_docstring: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - toc:
      permalink: true
